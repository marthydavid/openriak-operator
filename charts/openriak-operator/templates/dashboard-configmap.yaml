{{- if .Values.dashboard.enabled }}
{{- /* The JSON is embedded verbatim: .Files.Get output is not re-templated, so
       Grafana's {{ legend }} placeholders survive. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openriak-operator.fullname" . }}-riak-dashboard
  namespace: {{ .Values.dashboard.namespace | default .Release.Namespace }}
  labels:
    {{- include "openriak-operator.labels" . | nindent 4 }}
    {{- with .Values.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.dashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  riak-kv.json: |-
{{ .Files.Get "dashboards/riak-kv.json" | indent 4 }}
{{- end }}
