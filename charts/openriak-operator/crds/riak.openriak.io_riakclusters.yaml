                      type: string
                    pod:
                      description: Pod is the Kubernetes Pod name.
                      type: string
                    ready:
                      description: Ready indicates if the node's pod reports the Ready
                        condition.
                      type: boolean
                    storageReady:
                      description: StorageReady indicates if the node's data volume
                        is available.
                      type: boolean
                  type: object
                type: array
              monitoringStatus:
                description: MonitoringStatus indicates the monitoring configuration
                  status.
                properties:
                  enabled:
                    description: Enabled indicates if monitoring is enabled.
                    type: boolean
                  exporterError:
                    description: ExporterError names the first node whose exporter
                      is not ready, and why.
                    type: string
                  exporterReady:
                    description: ExporterReady indicates if every node's metrics exporter
                      sidecar is ready.
                    type: boolean
                  serviceMonitorReady:
                    description: |-
                      ServiceMonitorReady indicates if the ServiceMonitor exists (it is skipped on
                      clusters without the Prometheus Operator CRDs).
                    type: boolean
                type: object
              nodeConditions:
