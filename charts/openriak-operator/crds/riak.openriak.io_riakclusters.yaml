                        Unhealthy or Unknown.'
                      type: string
                    name:
                      description: Name is the node name.
                      type: string
                    phase:
                      description: Phase is the phase of the node's pod, e.g. Running
                        or Pending.
                      type: string
                    podName:
                      description: PodName is the Kubernetes Pod name.
                      type: string
                    ready:
                      description: Ready indicates if the node's pod reports the Ready
                        condition.
                      type: boolean
                    storageClassName:
                      description: StorageClassName is the storage class backing the
                        node's data volume.
                      type: string
                    storageReady:
                      description: |-
                        StorageReady indicates if the node's data volume is available: its PVC is
                        Bound, or its emptyDir exists on an ephemeral cluster.
                      type: boolean
                    storageSize:
                      description: StorageSize is the size of the node's data volume.
                      type: string
                  type: object
                type: array
              phase:
                description: Phase is the current phase of the cluster (Creating,
                  Ready, Updating, Failed).
                type: string
              readyNodes:
                description: ReadyNodes is the number of ready nodes.
                format: int32
                type: integer
              securityEnabled:
                description: |-
                  SecurityEnabled records that Riak security has been enabled on the cluster.
                  It is enabled once (when the first cert-auth user is created), not per user:
                  repeatedly running `riak-admin security enable` on a live node bounces its
                  client listeners and destabilises it under load.
                type: boolean
              storageClassName:
                description: |-
                  StorageClassName is the storage class backing the node data volumes. Empty for
                  ephemeral clusters, which use an emptyDir instead.
                type: string
              storageSize:
                description: |-
                  StorageSize is the size of each node's data volume, including the operator's
                  default when spec.storageSize is unset. Empty for ephemeral clusters.
                type: string
              tlsStatus:
                description: TLSStatus indicates the TLS configuration status.
                properties:
                  certManagerError:
                    description: CertManagerError explains why the certificate is
                      not ready.
                    type: string
                  certManagerReady:
                    description: CertManagerReady indicates if cert-manager has issued
                      the cluster certificate.
                    type: boolean
                  clientReady:
                    description: |-
                      ClientReady indicates if client TLS is ready. Riak serves client and
                      inter-node TLS from the same certificate, so the two become ready together.
                    type: boolean
                  enabled:
                    description: Enabled indicates if TLS is enabled.
                    type: boolean
                  interNodeReady:
                    description: |-
                      InterNodeReady indicates if inter-node TLS is ready, i.e. the certificate has
                      been issued and every node is running with it.
                    type: boolean
                type: object
              totalNodes:
                description: |-
                  TotalNodes is the desired number of nodes (spec.size), so readyNodes out of
                  totalNodes reads as progress towards the spec.
                format: int32
                type: integer
              users:
                description: Users lists the RiakUsers targeting this cluster, by
