                minimum: 1024
                type: integer
              size:
                description: Size is the number of nodes in the cluster.
                format: int32
                maximum: 999
                minimum: 1
                type: integer
              storageClassName:
                description: StorageClassName for persistent volumes.
                type: string
              storageSize:
                anyOf:
                - type: integer
                - type: string
                description: StorageSize is the size of storage for each Riak node
