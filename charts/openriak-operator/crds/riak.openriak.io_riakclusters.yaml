                  - status
                  - type
                  type: object
                type: array
              ephemeralStorage:
                description: EphemeralStorage indicates if ephemeral storage is in
                  use.
                type: boolean
              lastUpdateTime:
                description: LastUpdateTime is the last time the cluster was updated.
