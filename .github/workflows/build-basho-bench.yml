name: Build Basho Bench Image

on:
  push:
    branches: [main]
    paths:
      - "images/basho-bench/**"
      - ".github/workflows/build-basho-bench.yml"
  pull_request:
    branches: [main]
    paths:
      - "images/basho-bench/**"
      - ".github/workflows/build-basho-bench.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/marthydavid/basho-bench
          tags: |
            type=raw,value=openriak-3.2,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short
            # Non-production: same-repo PR builds are pushed as pr-<N> only.
            type=ref,event=pr

      # amd64 only: the arm64 build of the eleveldb/bitcask dependencies has not been tried.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images/basho-bench
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
