name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**.md"
      - ".claude/**"
      - ".github/workflows/docs.yml"
    tags: ['*']
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "**.md"
      - ".claude/**"
      - ".github/workflows/docs.yml"

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '~1.25'

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14
