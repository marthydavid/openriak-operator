                type: boolean
              bucketName:
                description: BucketName is the name of the bucket.
                minLength: 1
                type: string
              bucketType:
                description: BucketType is the bucket type (default is "default").
                type: string
              clusterName:
                description: ClusterName is the name of the RiakCluster this bucket
