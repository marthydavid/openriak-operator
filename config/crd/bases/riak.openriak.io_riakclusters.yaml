---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: riakclusters.riak.openriak.io
spec:
  group: riak.openriak.io
  names:
    kind: RiakCluster
    listKind: RiakClusterList
    plural: riakclusters
    singular: riakcluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.readyNodes
      name: Nodes
      type: string
    - jsonPath: .status.totalNodes
      name: Total
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: RiakCluster is the Schema for the riakclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RiakClusterSpec defines the desired state of RiakCluster.
            properties:
              ephemeralStorage:
                description: |-
                  EphemeralStorage, when true, backs each Riak node's data directory with an
                  emptyDir volume instead of a PersistentVolumeClaim. Data does NOT survive
                  pod restarts. Intended for testing/CI on clusters without a dynamic storage
                  provisioner; not for production. When set, StorageClassName and StorageSize
                  are ignored for data-volume provisioning.
                type: boolean
              image:
                description: |-
                  Image is the Riak Docker image to use (e.g., ghcr.io/marthydavid/riak:3.2.6).
                  When omitted, the operator's --riak-image flag value is used as the default.
                minLength: 1
                type: string
              imagePullPolicy:
                description: ImagePullPolicy defines how the image should be pulled.
                type: string
              monitoring:
                description: Monitoring configures Prometheus metrics for the Riak
                  nodes.
                properties:
                  enabled:
                    description: Enabled turns on the metrics exporter sidecar.
                    type: boolean
                  exporterImage:
                    description: ExporterImage overrides the json_exporter sidecar
                      image.
                    type: string
                  metricsConfig:
                    description: |-
                      MetricsConfig supplies your own json_exporter configuration (which of
                      Riak's /stats fields become which metrics) from a ConfigMap, replacing the
                      built-in mapping. The module must be named "riak". The exporter reads the
                      file at start-up, so restart the Riak pods after changing the ConfigMap.
                    properties:
                      configMapKeyRef:
                        description: ConfigMapKeyRef selects the key of a ConfigMap
                          in the cluster's namespace.
                        properties:
                          key:
                            description: The key to select.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the ConfigMap or its key
                              must be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                    required:
                    - configMapKeyRef
                    type: object
                  scrapeKind:
                    default: PodMonitor
                    description: |-
                      ScrapeKind selects the Prometheus Operator object the operator creates to
                      scrape the exporter: a PodMonitor (default; selects the Riak pods directly),
                      a ServiceMonitor (selects the client Service), or None (bring your own, see
                      examples/metrics). It is skipped, not an error, when the Prometheus
                      Operator CRDs are not installed.
                    enum:
                    - PodMonitor
                    - ServiceMonitor
                    - None
                    type: string
                required:
                - enabled
                type: object
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector for node affinity.
                type: object
              podAntiAffinity:
                default: Required
                description: |-
                  PodAntiAffinity controls how the Riak pods of this cluster are spread over Kubernetes nodes.
                  Required (the default) allows at most one Riak pod per node, so the cluster can never have
                  more pods than there are schedulable nodes. Preferred still spreads the pods when it can
                  but lets the scheduler put several on one node, which is what lets a cluster grow past the
                  node count (test and small clusters). None adds no rule. With Preferred or None the loss of
                  one Kubernetes node can take out several Riak nodes at once, and with them more than one
                  replica of some data: do not use it where that matters.
                enum:
                - Required
                - Preferred
                - None
                type: string
              podDisruptionBudget:
                description: |-
                  PodDisruptionBudget creates a PodDisruptionBudget allowing one Riak pod of this cluster to
                  be unavailable at a time, so node drains and cluster upgrades cannot take down two Riak
                  nodes at once. Enabled by default.
                properties:
                  enabled:
                    default: true
                    description: Enabled creates the PodDisruptionBudget. Defaults
                      to true.
                    type: boolean
                type: object
              podSecurityContext:
                description: |-
                  PodSecurityContext is applied to the generated Riak pods. Leave it unset to keep the
                  image's own user and the volume's ownership as they are. A freshly provisioned PVC replaces
                  the image's /var/lib/riak, so a non-root image needs an fsGroup it can write through (the
                  group must match the image and the storage driver; there is no universal value).
                properties:
                  appArmorProfile:
                    description: |-
                      appArmorProfile is the AppArmor options to use by the containers in this pod.
                      Note that this field cannot be set when spec.os.name is windows.
                    properties:
                      localhostProfile:
                        description: |-
                          localhostProfile indicates a profile loaded on the node that should be used.
                          The profile must be preconfigured on the node to work.
                          Must match the loaded name of the profile.
                          Must be set if and only if type is "Localhost".
                        type: string
                      type:
                        description: |-
                          type indicates which kind of AppArmor profile will be applied.
                          Valid options are:
                            Localhost - a profile pre-loaded on the node.
                            RuntimeDefault - the container runtime's default profile.
                            Unconfined - no AppArmor enforcement.
                        type: string
                    required:
                    - type
                    type: object
                  fsGroup:
                    description: |-
                      A special supplemental group that applies to all containers in a pod.
                      Some volume types allow the Kubelet to change the ownership of that volume
                      to be owned by the pod:

                      1. The owning GID will be the FSGroup
                      2. The setgid bit is set (new files created in the volume will be owned by FSGroup)
                      3. The permission bits are OR'd with rw-rw----

                      If unset, the Kubelet will not modify the ownership and permissions of any volume.
                      Note that this field cannot be set when spec.os.name is windows.
                    format: int64
                    type: integer
                  fsGroupChangePolicy:
                    description: |-
                      fsGroupChangePolicy defines behavior of changing ownership and permission of the volume
                      before being exposed inside Pod. This field will only apply to
                      volume types which support fsGroup based ownership(and permissions).
                      It will have no effect on ephemeral volume types such as: secret, configmaps
                      and emptydir.
                      Valid values are "OnRootMismatch" and "Always". If not specified, "Always" is used.
                      Note that this field cannot be set when spec.os.name is windows.
                    type: string
                  runAsGroup:
                    description: |-
                      The GID to run the entrypoint of the container process.
                      Uses runtime default if unset.
                      May also be set in SecurityContext.  If set in both SecurityContext and
                      PodSecurityContext, the value specified in SecurityContext takes precedence
                      for that container.
                      Note that this field cannot be set when spec.os.name is windows.
                    format: int64
                    type: integer
                  runAsNonRoot:
                    description: |-
                      Indicates that the container must run as a non-root user.
                      If true, the Kubelet will validate the image at runtime to ensure that it
                      does not run as UID 0 (root) and fail to start the container if it does.
                      If unset or false, no such validation will be performed.
                      May also be set in SecurityContext.  If set in both SecurityContext and
                      PodSecurityContext, the value specified in SecurityContext takes precedence.
                    type: boolean
                  runAsUser:
                    description: |-
                      The UID to run the entrypoint of the container process.
                      Defaults to user specified in image metadata if unspecified.
                      May also be set in SecurityContext.  If set in both SecurityContext and
                      PodSecurityContext, the value specified in SecurityContext takes precedence
                      for that container.
                      Note that this field cannot be set when spec.os.name is windows.
                    format: int64
                    type: integer
                  seLinuxChangePolicy:
                    description: |-
                      seLinuxChangePolicy defines how the container's SELinux label is applied to all volumes used by the Pod.
                      It has no effect on nodes that do not support SELinux or to volumes does not support SELinux.
                      Valid values are "MountOption" and "Recursive".

                      "Recursive" means relabeling of all files on all Pod volumes by the container runtime.
                      This may be slow for large volumes, but allows mixing privileged and unprivileged Pods sharing the same volume on the same node.

                      "MountOption" mounts all eligible Pod volumes with `-o context` mount option.
                      This requires all Pods that share the same volume to use the same SELinux label.
                      It is not possible to share the same volume among privileged and unprivileged Pods.
                      Eligible volumes are in-tree FibreChannel and iSCSI volumes, and all CSI volumes
                      whose CSI driver announces SELinux support by setting spec.seLinuxMount: true in their
                      CSIDriver instance. Other volumes are always re-labelled recursively.
                      "MountOption" value is allowed only when SELinuxMount feature gate is enabled.

                      If not specified and SELinuxMount feature gate is enabled, "MountOption" is used.
                      If not specified and SELinuxMount feature gate is disabled, "MountOption" is used for ReadWriteOncePod volumes
                      and "Recursive" for all other volumes.

                      This field affects only Pods that have SELinux label set, either in PodSecurityContext or in SecurityContext of all containers.

                      All Pods that use the same volume should use the same seLinuxChangePolicy, otherwise some pods can get stuck in ContainerCreating state.
                      Note that this field cannot be set when spec.os.name is windows.
                    type: string
                  seLinuxOptions:
                    description: |-
                      The SELinux context to be applied to all containers.
                      If unspecified, the container runtime will allocate a random SELinux context for each
                      container.  May also be set in SecurityContext.  If set in
                      both SecurityContext and PodSecurityContext, the value specified in SecurityContext
                      takes precedence for that container.
                      Note that this field cannot be set when spec.os.name is windows.
                    properties:
                      level:
                        description: Level is SELinux level label that applies to
                          the container.
                        type: string
                      role:
                        description: Role is a SELinux role label that applies to
                          the container.
                        type: string
                      type:
                        description: Type is a SELinux type label that applies to
                          the container.
                        type: string
                      user:
                        description: User is a SELinux user label that applies to
                          the container.
                        type: string
                    type: object
                  seccompProfile:
                    description: |-
                      The seccomp options to use by the containers in this pod.
                      Note that this field cannot be set when spec.os.name is windows.
                    properties:
                      localhostProfile:
                        description: |-
                          localhostProfile indicates a profile defined in a file on the node should be used.
                          The profile must be preconfigured on the node to work.
                          Must be a descending path, relative to the kubelet's configured seccomp profile location.
                          Must be set if type is "Localhost". Must NOT be set for any other type.
                        type: string
                      type:
                        description: |-
                          type indicates which kind of seccomp profile will be applied.
                          Valid options are:

                          Localhost - a profile defined in a file on the node should be used.
                          RuntimeDefault - the container runtime default profile should be used.
                          Unconfined - no profile should be applied.
                        type: string
                    required:
                    - type
                    type: object
                  supplementalGroups:
                    description: |-
                      A list of groups applied to the first process run in each container, in
                      addition to the container's primary GID and fsGroup (if specified).  If
                      the SupplementalGroupsPolicy feature is enabled, the
                      supplementalGroupsPolicy field determines whether these are in addition
                      to or instead of any group memberships defined in the container image.
                      If unspecified, no additional groups are added, though group memberships
                      defined in the container image may still be used, depending on the
                      supplementalGroupsPolicy field.
                      Note that this field cannot be set when spec.os.name is windows.
                    items:
                      format: int64
                      type: integer
                    type: array
                    x-kubernetes-list-type: atomic
                  supplementalGroupsPolicy:
                    description: |-
                      Defines how supplemental groups of the first container processes are calculated.
                      Valid values are "Merge" and "Strict". If not specified, "Merge" is used.
                      (Alpha) Using the field requires the SupplementalGroupsPolicy feature gate to be enabled
                      and the container runtime must implement support for this feature.
                      Note that this field cannot be set when spec.os.name is windows.
                    type: string
                  sysctls:
                    description: |-
                      Sysctls hold a list of namespaced sysctls used for the pod. Pods with unsupported
                      sysctls (by the container runtime) might fail to launch.
                      Note that this field cannot be set when spec.os.name is windows.
                    items:
                      description: Sysctl defines a kernel parameter to be set
                      properties:
                        name:
                          description: Name of a property to set
                          type: string
                        value:
                          description: Value of a property to set
                          type: string
                      required:
                      - name
                      - value
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  windowsOptions:
                    description: |-
                      The Windows specific settings applied to all containers.
                      If unspecified, the options within a container's SecurityContext will be used.
                      If set in both SecurityContext and PodSecurityContext, the value specified in SecurityContext takes precedence.
                      Note that this field cannot be set when spec.os.name is linux.
                    properties:
                      gmsaCredentialSpec:
                        description: |-
                          GMSACredentialSpec is where the GMSA admission webhook
                          (https://github.com/kubernetes-sigs/windows-gmsa) inlines the contents of the
                          GMSA credential spec named by the GMSACredentialSpecName field.
                        type: string
                      gmsaCredentialSpecName:
                        description: GMSACredentialSpecName is the name of the GMSA
                          credential spec to use.
                        type: string
                      hostProcess:
                        description: |-
                          HostProcess determines if a container should be run as a 'Host Process' container.
                          All of a Pod's containers must have the same effective HostProcess value
                          (it is not allowed to have a mix of HostProcess containers and non-HostProcess containers).
                          In addition, if HostProcess is true then HostNetwork must also be set to true.
                        type: boolean
                      runAsUserName:
                        description: |-
                          The UserName in Windows to run the entrypoint of the container process.
                          Defaults to the user specified in image metadata if unspecified.
                          May also be set in PodSecurityContext. If set in both SecurityContext and
                          PodSecurityContext, the value specified in SecurityContext takes precedence.
                        type: string
                    type: object
                type: object
              readOnlyRootFilesystem:
                description: |-
                  ReadOnlyRootFilesystem makes the root filesystem of the Riak container read-only. The
                  paths Riak writes outside the data volume (/etc/riak, /var/log/riak, /var/run/riak, /tmp)
                  become emptyDir volumes, and an init container seeds /etc/riak from the image. Log files and
                  the generated riak.conf are then lost when a pod restarts, which is fine: the entrypoint
                  regenerates riak.conf and the console log is on the container's stdout. Off by default;
                  enabling it on an existing cluster rolls the pods once.
                type: boolean
              resources:
                description: Resources specifies compute resources for each Riak node.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              riakConfig:
                additionalProperties:
                  type: string
                description: |-
                  RiakConfig sets arbitrary riak.conf keys on all nodes. Any key from the
                  Riak configuration reference works, e.g.:
                    storage_backend: memory
                    memory_backend.ttl: 60s
                    memory_backend.max_memory_per_vnode: 128MB
                    multi_backend.mem_ttl.storage_backend: memory
                  Changing values rolls the StatefulSet so nodes restart with the new
                  configuration. WARNING: changing storage_backend (or a bucket's backend
                  binding) on a cluster with data does NOT migrate that data — objects
                  written to the previous backend become unreachable. Plan a backup or
                  migration before switching backends on a live cluster.
                  Bind buckets to a multi_backend entry via
                  RiakBucket.spec.properties ("backend": "<name>").
                type: object
              rollout:
                description: |-
                  Rollout controls how the Riak nodes are restarted when the pod template changes (an
                  operator upgrade, a new image, spec.riakConfig, ...). The operator restarts one node at a
                  time, highest ordinal first (the seed pod <name>-0 last), and only when the cluster is
                  settled: every node Ready and a valid ring member and, unless disabled, no handoff or
                  ownership transfers running. This is what Riak needs to keep its replicas in place while a
                  node is away.
                properties:
                  paused:
                    description: |-
                      Paused stops the rollout after the node being restarted: no further node is restarted until
                      it is set back to false.
                    type: boolean
                  stallTimeout:
                    description: |-
                      StallTimeout is how long the rollout may wait for the cluster to settle before the
                      RolloutStalled condition is set to True. The rollout keeps waiting; it never forces a
                      restart. Defaults to 30m.
                    type: string
                  waitForTransfers:
                    default: true
                    description: |-
                      WaitForTransfers makes the operator wait, before it restarts the next node, until
                      `riak-admin transfers` reports no active or pending transfers. Turn it off only on clusters
                      where a transfer may never finish and a node going away with replicas still moving is
                      acceptable. Defaults to true.
                    type: boolean
                type: object
              servicePort:
                description: ServicePort is the port for the Riak protocol service.
                format: int32
                maximum: 65535
                minimum: 1024
                type: integer
              size:
                description: Size is the number of nodes in the cluster.
                format: int32
                maximum: 999
                minimum: 1
                type: integer
              storageClassName:
                description: StorageClassName for persistent volumes.
                type: string
              storageSize:
                anyOf:
                - type: integer
                - type: string
                description: StorageSize is the size of storage for each Riak node
                  (e.g., 10Gi).
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              terminationGracePeriodSeconds:
                default: 300
                description: |-
                  TerminationGracePeriodSeconds is how long a Riak pod gets to stop cleanly (`riak stop`,
                  flushing the vnodes) before it is killed. A killed node needs crash recovery on its next
                  start, which is slow on large nodes, so raise it for big data sets.
                format: int64
                minimum: 30
                type: integer
              tls:
                description: TLS configuration for inter-node communication.
                properties:
                  additionalClientCAs:
                    description: |-
                      AdditionalClientCAs lists extra certificate authorities Riak trusts for
                      client certificates, besides the CA of the cluster's own certificate. Use it
                      for RiakUsers whose certificates come from an external CA (spec.certificateRef.
                      externalSecretName). The operator merges them with the cluster CA into the
                      Secret <cluster>-tls-trust, which Riak uses as its ssl.cacertfile.
                    items:
                      description: |-
                        TrustedCASource references a Secret or ConfigMap key holding one or more PEM
                        CA certificates, in the cluster's namespace. Set exactly one of the two.
                      properties:
                        configMapRef:
                          description: |-
                            ConfigMapRef selects a key of a ConfigMap (for example one published by
                            trust-manager).
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        secretRef:
                          description: SecretRef selects a key of a Secret.
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                      x-kubernetes-validations:
                      - message: set exactly one of secretRef or configMapRef
                        rule: has(self.secretRef) != has(self.configMapRef)
                    type: array
                  certManager:
                    description: CertManager enables cert-manager integration.
                    properties:
                      issuerKind:
                        description: IssuerKind is the kind of issuer (Issuer or ClusterIssuer).
                        type: string
                      issuerName:
                        description: IssuerName is the cert-manager issuer to use.
                        type: string
                    type: object
                  enabled:
                    description: Enabled specifies if TLS should be used.
                    type: boolean
                type: object
            required:
            - size
            type: object
          status:
            description: RiakClusterStatus defines the observed state of RiakCluster.
            properties:
              buckets:
                description: Buckets lists the RiakBuckets targeting this cluster,
                  by resource name.
                items:
                  description: RiakBucketRef references a RiakBucket belonging to
                    a cluster.
                  properties:
                    name:
                      description: Name is the bucket name.
                      type: string
                    ready:
                      description: Ready indicates if the bucket is ready.
                      type: boolean
                  type: object
                type: array
              conditions:
                description: Conditions represent the latest observed conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
