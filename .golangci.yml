version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # Kubernetes label keys and volume names are API identifiers, not magic strings.
      ignore-string-values:
        - '^(app|cluster|data|riak|kind|name|namespace|phase)$'
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      # Specs and the scale/e2e harnesses repeat literals (names, verbs) for readability.
      - linters:
          - goconst
        path: (_test\.go|^test/)
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
